<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Little Lemon | Mediterranean Restaurant</title>

    <meta name="description" content="Experience authentic Mediterranean cuisine, fresh seasonal ingredients, and handcrafted wines while enjoying breathtaking ocean views and unforgettable sunset dining." />
    <meta name="robots" content="index,follow" />

    <meta property="og:site_name" content="Little Lemon" />
    <meta property="og:title" content="Little Lemon | Mediterranean Restaurant & Oceanfront Dining" />
    <meta property="og:description" content="Experience authentic Mediterranean cuisine, fresh seasonal ingredients, and handcrafted wines while enjoying breathtaking ocean views and unforgettable sunset dining." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.littlelemon.com" />
    <meta property="og:image" content="https://www.littlelemon.com/images/main-banner-picture.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Little Lemon | Mediterranean Restaurant & Oceanfront Dining" />
    <meta name="twitter:description" content="Experience authentic Mediterranean cuisine, fresh seasonal ingredients, and handcrafted wines while enjoying breathtaking ocean views and unforgettable sunset dining." />
    <meta name="twitter:image" content="https://www.littlelemon.com/images/main-banner-picture.png" />



    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="main-header">
        <img class="main-header_logo" src="./images/logo-yellow.png" alt="Little Lemon Logo">
    </header>
    <nav class="main-navigation">
        <ul class="main-navigation_links">
            <li><a href="#" class="main-navigation_link">Home</a></li>
            <li><a href="#" class="main-navigation_link">About</a></li>
            <li><a href="#" class="main-navigation_link">Reservations</a></li>
            <li><a href="#" class="main-navigation_link">Contact</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <section class="main-content_banner">
            <figure class="banner-content width-100">
                <img src="./images/main-banner-picture.png" alt="Promotional Banner">
                <figcaption>
                    <h3>Sunset Feast Special</h3>
                    <p><strong>Golden sunsets. Mediterranean flavors. Unforgettable moments.</strong></p>
                    <p>Enjoy our Sunset Feast for Two from 5:30–7:30 PM with two entrées, a shared appetizer, dessert, and two glasses of wine—all for $69.</p>
                    <a href="#" class="primary-button">Learn More</a>
                </figcaption>
            </figure>
        </section>
        <section class="main-content_info">
            <figure class="width-33">
                <img src="./images/information-1.png" alt="Fresh Mediterranean ingredients including olive oil, tomatoes, lemons, herbs, olives, artisan bread, and fresh fish arranged on a rustic wooden table.">
                <figcaption>
                    <h4>Fresh Ingredients</h4>
                    <p>Every dish begins with carefully selected seasonal produce, fresh seafood, and premium olive oil, bringing the authentic flavors of the Mediterranean to every plate.</p>
                </figcaption>
            </figure>
            <figure class="width-33">
                <img src="./images/information-2.png" alt="Guests enjoying dinner on a Mediterranean seaside terrace overlooking the ocean at sunset with warm ambient lighting.">
                <figcaption>
                    <h4>Oceanfront Dining</h4>
                    <p>Relax on our open-air terrace with panoramic sea views, where every meal is accompanied by the sound of the waves and breathtaking sunsets.</p>
                </figcaption>
            </figure>
            <figure class="width-33">
                <img src="./images/information-3.png" alt="Beautifully plated Mediterranean fish entrée served with a glass of white wine in a sunlit seaside restaurant.">
                <figcaption>
                    <h4>Handcrafted Flavors</h4>
                    <p>From traditional family recipes to modern Mediterranean classics, every dish is prepared with passion and paired with a carefully curated wine selection.</p>
                </figcaption>
            </figure>
        </section>
    </main>
    <footer class="main-footer">
        <div class="width-50">
            <img src="./images/logo-green.png" alt="Little Lemon Logo" class="main-footer_logo">
        </div>
        <div class="width-50"><p>Copyright Little Lemon</p></div>
    </footer>
</body>
</html>
